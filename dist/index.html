<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#1e2420"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>岐阜 30景</title><meta name="description" content="岐阜県の森、渓谷、田園、湖を案内するスマートフォン専用の30景。">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%231e2420'/%3E%3Cpath d='M12 45 27 20 30 35 44 25 54 45M20 51h25' fill='none' stroke='%23ede8dc' stroke-width='3'/%3E%3C/svg%3E">
  <link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./assets/icon-192.png">
  <link rel="preload" href="./assets/NotoSerifJP.woff2" as="font" type="font/woff2" crossorigin><link rel="preload" href="./assets/NotoSansJP.woff2" as="font" type="font/woff2" crossorigin><link rel="preload" as="image" href="./assets/kabusugi.webp"><link rel="stylesheet" href="./style.css"><link rel="stylesheet" href="./experience.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <div class="desktop-message" id="desktop-message"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="2" width="12" height="20" rx="2"/><path d="M10 18h4"/></svg><p>スマートフォン専用</p></div>
  <main class="app" id="app">
    <section class="view scenery-view active" id="scenery-view" aria-label="風景">
      <div class="photo-stage" id="photo-stage" aria-label="左右のスワイプで場所を切り替え">
        <div class="photo-canvas" id="photo-canvas"><div class="photo-optics" id="photo-optics"><img class="scene-photo" id="scene-photo" src="./assets/kabusugi.webp" alt="株杉の森" fetchpriority="high"><img class="scene-photo scene-photo-previous" id="scene-photo-previous" alt="" aria-hidden="true" hidden></div></div>
        <div class="image-shade"></div><div class="photo-load" id="photo-load" hidden><span></span></div>
        <div class="photo-unavailable" id="photo-unavailable" hidden><span id="unavailable-category"></span><p id="unavailable-name"></p><a id="unavailable-link" target="_blank" rel="noopener noreferrer">公式の写真を見る</a></div>
        <header class="scene-header"><button id="filter-open" class="location-picker" aria-label="地域と景色で絞り込む"><span id="location-label">岐阜県</span><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m6 8 4 4 4-4"/></svg></button><div class="header-actions"><button id="fullscreen-button" class="icon-button glass" aria-label="全画面に切り替える"></button><button id="scene-save" class="icon-button glass" aria-label="この場所を保存" aria-pressed="false"></button></div></header>
        <span class="photo-caption" id="photo-caption"></span>
      </div>
      <div class="scene-panel" id="scene-panel">
        <div class="scene-heading"><div class="scene-meta"><span id="scene-area">関市・板取</span><span class="meta-rule"></span><span id="scene-category">森・湿原</span></div><h1 id="scene-name">株杉の森</h1><p class="scene-reading" id="scene-reading">かぶすぎのもり</p></div>
        <p class="scene-summary" id="scene-summary">一本の根元から何本もの幹が立つ、板取の杉林。</p>
        <div id="scene-tags"></div><div class="scene-quick-info"><p class="scene-time" id="scene-time"></p><span id="scene-budget" class="compact-budget"></span></div>
        <div class="scene-actions"><button id="scene-random" class="button-random" aria-label="ランダムに選ぶ"><span data-icon="shuffle"></span><span>ランダム</span></button><button id="detail-open" class="button-secondary">概要</button><a id="scene-map" class="button-primary" target="_blank" rel="noopener noreferrer">地図を開く</a></div>
        <div class="scene-stepper"><button id="previous" class="step-button" aria-label="前の場所"></button><div class="scene-progress" id="scene-progress" data-scrubber role="slider" tabindex="0" aria-label="風景を選ぶ" aria-valuemin="1" aria-valuemax="30" aria-valuenow="1"><span id="scene-position">01</span><div class="progress-track"><span id="progress-fill"></span><div class="scene-ticks" id="scene-ticks" aria-hidden="true"></div></div><span id="scene-total">30</span></div><button id="next" class="step-button" aria-label="次の場所"></button></div>
      </div>
      <div class="scenery-empty" id="scenery-empty" hidden><p>該当する場所がありません。</p><button data-reset>絞り込みを解除</button></div>
    </section>
    <section class="view list-view" id="list-view" aria-labelledby="list-title" hidden><header class="view-header"><h1 id="list-title">30景</h1><div class="list-header-actions"><button class="random-pill" id="list-random" aria-label="ランダムに選ぶ"><span data-icon="shuffle"></span><span>ランダム</span></button><button class="icon-button" id="list-filter" aria-label="絞り込み"></button></div></header><div class="list-tools"><label class="search-field"><span id="search-icon"></span><input id="search" type="search" placeholder="地名を検索" aria-label="地名を検索"></label><div class="quick-areas" role="group" aria-label="地域"><button class="selected" data-area="all" aria-pressed="true">すべて</button><button data-area="tono" aria-pressed="false">東濃</button><button data-area="chuno" aria-pressed="false">中濃</button><button data-area="seino" aria-pressed="false">西濃</button><button data-area="hida" aria-pressed="false">飛騨</button><button data-area="gifu" aria-pressed="false">岐阜・山県</button></div><div class="result-meta"><span id="filter-description">すべての風景</span><span id="list-count" role="status">30件</span></div></div><div class="spot-list" id="spot-list"></div><div class="list-empty" id="list-empty" hidden><p>該当する場所がありません。</p><button data-reset>絞り込みを解除</button></div></section>
    <section class="view saved-view" id="saved-view" aria-labelledby="saved-title" hidden><header class="view-header"><h1 id="saved-title">保存した場所</h1><span class="view-count" id="saved-count">0</span></header><div class="spot-list" id="saved-list"></div><div class="list-empty" id="saved-empty"><span id="saved-empty-icon"></span><p>保存した場所がここに表示されます。</p></div></section>
    <section class="view settings-view" id="settings-view" aria-labelledby="settings-title" hidden><header class="view-header"><h1 id="settings-title">設定</h1></header><div class="settings-content"><div class="setting-section"><h2>表示</h2><button class="setting-row" id="settings-fullscreen"><span>全画面表示</span><span id="fullscreen-state">切り替える</span></button><button class="setting-row" id="install-button" hidden><span>ホーム画面に追加</span><span>追加</span></button><label class="setting-row"><span>起動時にランダム</span><input type="checkbox" id="random-start" role="switch"></label><label class="setting-row"><span>動きを抑える</span><input type="checkbox" id="reduce-motion" role="switch"></label></div><div class="setting-section"><h2>オフライン</h2><button class="setting-row offline-row" id="offline-download"><span>写真と案内を保存</span><span id="offline-state">未保存</span></button></div><div class="setting-section"><h2>クレジット</h2><dl class="credits"><div><dt>製作者</dt><dd>TAKU</dd></div><div><dt>制作AI</dt><dd>GPT 6 ASTRA MAX ONLY</dd></div></dl><p class="creation-date">2026年10月7日午前に作成されました</p></div><div class="setting-section"><h2>案内情報</h2><button class="setting-row" id="credits-open"><span>出典・写真ライセンス</span><span>開く</span></button></div></div></section>
    <nav class="tabbar" aria-label="画面切り替え"><button class="active" data-view="scenery" aria-current="page"><span data-icon="landscape"></span><span>風景</span></button><button data-view="list"><span data-icon="grid"></span><span>一覧</span></button><button data-view="saved"><span data-icon="bookmark"></span><span>保存</span><b id="nav-saved-count" hidden></b></button><button data-view="settings"><span data-icon="settings"></span><span>設定</span></button></nav>
  </main>
  <dialog id="detail-dialog" class="sheet" aria-labelledby="detail-title"><header class="sheet-header detail-toolbar"><button class="icon-button close-dialog" aria-label="閉じる"></button></header><div id="detail-content" class="detail-content"></div></dialog>
  <dialog id="filter-dialog" class="sheet filter-sheet" aria-labelledby="filter-title"><header class="sheet-header"><h2 id="filter-title">絞り込み</h2><button class="icon-button close-dialog" aria-label="閉じる"></button></header><div class="filter-content"><h3>地域</h3><div class="filter-options" id="area-options"><button data-area="all">すべて</button><button data-area="tono">東濃</button><button data-area="chuno">中濃</button><button data-area="seino">西濃</button><button data-area="hida">飛騨</button><button data-area="gifu">岐阜・山県</button></div><h3>風景</h3><div class="filter-options" id="category-options"><button data-category="all">すべて</button><button data-category="water">滝・渓谷</button><button data-category="forest">森・湿原</button><button data-category="rural">山里・田園</button><button data-category="lake">湖・水辺</button></div><h3>移動・散策</h3><div class="filter-options" id="travel-options"><button data-travel="all">すべて</button><button data-travel="walk">徒歩散策</button><button data-travel="cycle">現地ライド</button><button data-travel="rail">鉄道を使う</button></div><button class="filter-apply button-primary" id="filter-apply">30景を表示</button></div></dialog>
  <dialog id="credits-dialog" class="sheet" aria-labelledby="credits-title"><header class="sheet-header"><h2 id="credits-title">出典・写真ライセンス</h2><button class="icon-button close-dialog" aria-label="閉じる"></button></header><div class="credits-content" id="credits-content"></div></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

</body>
</html>
