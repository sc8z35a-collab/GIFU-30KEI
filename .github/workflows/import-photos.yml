name: Import verified scenery photographs
on:
  push:
    branches: [codex/photo-import-20261008]
    paths: [research/photo-import.json]
permissions:
  contents: write
jobs:
  photographs:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==12.3.0
      - run: python research/import-photo-assets.py
      - name: Commit verified photographs
        run: |
          git add dist/assets
          if git diff --cached --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Import source-verified scenery photographs"
          git push origin HEAD:${GITHUB_REF_NAME}
